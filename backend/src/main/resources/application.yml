spring:
  application:
    name: yuezhijian-server
  profiles:
    default: memory
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: YZJ_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

app:
  bootstrap:
    username: ${APP_BOOTSTRAP_USERNAME:admin}
    password: ${APP_BOOTSTRAP_PASSWORD:LocalDevOnly!2026}
