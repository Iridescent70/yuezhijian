spring:
  application:
    name: yuezhijian-server
  profiles:
    default: memory
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: YZJ_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

app:
  data-protection:
    encryption-key: ${APP_DATA_ENCRYPTION_KEY:}
    hash-pepper: ${APP_DATA_HASH_PEPPER:}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    username: ${APP_BOOTSTRAP_USERNAME:admin}
    password: ${APP_BOOTSTRAP_PASSWORD:LocalDevOnly!2026}
    full-name: ${APP_BOOTSTRAP_FULL_NAME:系统管理员}
  file-storage:
    provider: ${FILE_STORAGE_PROVIDER:local}
    max-upload-bytes: ${FILE_MAX_UPLOAD_BYTES:10485760}
    max-attachments-per-business: ${FILE_MAX_ATTACHMENTS_PER_BUSINESS:10}
    local-root: ${FILE_STORAGE_LOCAL_ROOT:.data/uploads}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:yuezhijian-dev}
  jobs:
    initial-delay-ms: ${JOB_INITIAL_DELAY_MS:3000}
    poll-delay-ms: ${JOB_POLL_DELAY_MS:2000}
    lease-minutes: ${JOB_LEASE_MINUTES:30}
    max-attempts: ${JOB_MAX_ATTEMPTS:3}
