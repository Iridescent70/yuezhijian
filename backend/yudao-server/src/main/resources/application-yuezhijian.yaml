# 悦指间本地/集成环境。生产环境必须由部署平台注入同名环境变量，禁止在 Git 中写入真实口令。
server:
  port: ${SERVER_PORT:48080}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
  datasource:
    dynamic:
      druid:
        validation-query: SELECT 1
      primary: master
      datasource:
        master:
          name: ${DB_NAME:yuezhijian_dev}
          url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=yuezhijian_dev;encrypt=true;trustServerCertificate=true}
          username: ${DB_USERNAME:yuezhijian_app}
          password: ${DB_PASSWORD:}
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '2026.06'
    clean-disabled: true
    validate-on-migrate: true
  boot:
    admin:
      client:
        enabled: false

logging:
  file:
    name: ${LOG_FILE:./.data/logs/yudao-server.log}
  level:
    root: info
    org.springframework.web: info
    org.springframework.boot.autoconfigure: info
    org.springframework.boot.context.properties: info
    cn.iocoder.yudao.module.infra.dal.mysql: info
    cn.iocoder.yudao.module.system.dal.mysql: info

yudao:
  web:
    admin-ui:
      url: ${ADMIN_UI_URL:http://localhost:5173}
  captcha:
    enable: false
  security:
    mock-enable: false
  api-encrypt:
    enable: false
  access-log:
    # 上游访问日志会记录登录请求体；在字段级脱敏完成前关闭，避免口令进入日志。
    enable: false
  demo: false
  tenant:
    enable: false
  swagger:
    title: 悦指间门店管理系统
    description: 悦指间门店管理系统管理端 API
    version: ${yudao.info.version}
    url: ${yudao.web.admin-ui.url}
    email: ''
    license: MIT
    license-url: https://github.com/YunaiV/ruoyi-vue-pro/blob/master/LICENSE

justauth:
  enabled: false

mybatis-plus:
  encryptor:
    # 仅用于敏感字段可逆加密，必须是 16/24/32 字节；生产环境由密钥管理服务注入。
    password: ${FIELD_ENCRYPTION_KEY}

yuezhijian:
  data-protection:
    # 检索哈希与密文使用不同密钥，禁止互相复用。
    hash-pepper: ${DATA_HASH_PEPPER}

# 系统模块当前仍会创建微信服务占位 Bean。仅选择项目已锁定的 HttpClient 5 实现，
# AppID/Secret 后续接入时必须通过部署环境注入，禁止复用上游示例凭据。
wx:
  mp:
    app-id: ${WX_MP_APP_ID:}
    secret: ${WX_MP_SECRET:}
    config-storage:
      type: RedisTemplate
      http-client-type: HttpComponents
  miniapp:
    appid: ${WX_MINIAPP_APP_ID:}
    secret: ${WX_MINIAPP_SECRET:}
    config-storage:
      type: RedisTemplate
      http-client-type: HttpComponents
